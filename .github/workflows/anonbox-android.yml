name: Build AnonBox APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/anonbox-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build_apk
        continue-on-error: true
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        if: steps.build_apk.outcome == 'success'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AnonBox.apk

      - name: Upload workflow artifact
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AnonBox-APK
          path: AnonBox.apk
          if-no-files-found: error

      - name: Publish stable APK link
        if: steps.build_apk.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view anonbox-latest >/dev/null 2>&1; then
            gh release upload anonbox-latest AnonBox.apk --clobber
            gh release edit anonbox-latest --title "AnonBox Android — dernière version" --notes "APK Android AnonBox. Le fichier est automatiquement remplacé à chaque compilation réussie."
          else
            gh release create anonbox-latest AnonBox.apk --title "AnonBox Android — dernière version" --notes "APK Android AnonBox. Le fichier est automatiquement remplacé à chaque compilation réussie."
          fi

      - name: Record build result
        if: always()
        run: |
          mkdir -p .build-status
          VERSION_NAME=$(grep -m1 "versionName" android/app/build.gradle | sed -E "s/.*versionName[[:space:]]+'([^']+)'.*/\1/")
          {
            echo "status=${{ steps.build_apk.outcome }}"
            echo "source_sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "version=${VERSION_NAME:-unknown}"
            echo "firebase=enabled"
          } > .build-status/android-latest.txt
          git config user.name "AnonBox CI"
          git config user.email "actions@users.noreply.github.com"
          git add .build-status/android-latest.txt
          git commit -m "Record AnonBox Android build result" || true
          git push || true

      - name: Fail workflow when APK build failed
        if: steps.build_apk.outcome != 'success'
        run: exit 1
