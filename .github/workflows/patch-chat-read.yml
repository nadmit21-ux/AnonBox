name: Patch chat read state

on:
  push:
    paths:
      - '.github/workflows/patch-chat-read.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch visitor chat read state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text(encoding='utf-8')
          old = "async function renderVisitorChat(){var c=visitorConversation();if(!c){showChatError('Conversation introuvable sur ce navigateur.');$('chatBackBtn').onclick=function(){goto(BASE+'?library=1')};return}clearStatus($('chatScreenStatus'));show('chatComposer');"
          new = "async function renderVisitorChat(){var c=visitorConversation();if(!c){showChatError('Conversation introuvable sur ce navigateur.');$('chatBackBtn').onclick=function(){goto(BASE+'?library=1')};return}try{var readOut=await rpc('anonbox_mark_library_read',{p_device_id:deviceId(),p_conversation_id:chatId});if(readOut&&readOut.ok!==false){var nowRead=new Date().toISOString();(c.messages||[]).forEach(function(mm){if(mm.direction==='owner'&&!mm.read_at)mm.read_at=nowRead})}}catch(e){}clearStatus($('chatScreenStatus'));show('chatComposer');"
          if old not in s:
              raise SystemExit('Target renderVisitorChat string not found')
          s = s.replace(old, new, 1)
          s = s.replace("'\\\"':'&quot'", "'\\\"':'&quot;'", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "AnonBox CI"
          git config user.email "actions@users.noreply.github.com"
          git add web/index.html
          git commit -m "Mark visitor replies read only when chat opens"
          git push
