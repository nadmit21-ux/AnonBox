name: AnonBox Realtime UI v1

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch realtime frontend
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/patch.log
          from pathlib import Path

          p = Path('web/index.html')
          s = p.read_text(encoding='utf-8')
          if 'realtime-ui-v1' in s:
              raise SystemExit('realtime-ui-v1 already applied')

          css_marker = '    @media(max-width:620px){'
          css = '''
    /* realtime-ui-v1 */
    .liveState{display:inline-flex;align-items:center;gap:5px;color:#94a3b8}.liveState:before{content:"";width:6px;height:6px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.10)}.liveState.online{color:#a7f3d0}.liveState.online:before{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.12)}.liveState.offline{color:#fecdd3}.liveState.offline:before{background:#fb7185;box-shadow:0 0 0 3px rgba(251,113,133,.10)}
'''
          if css_marker not in s:
              raise SystemExit('CSS marker missing')
          s = s.replace(css_marker, css + '\n' + css_marker, 1)

          old_top = '<div class="small muted topUserLine">AnonBox · <span id="who"></span></div>'
          new_top = '<div class="small muted topUserLine">AnonBox · <span id="who"></span> · <span id="realtimeState" class="liveState">Connexion…</span></div>'
          if old_top not in s:
              raise SystemExit('Top realtime label target missing')
          s = s.replace(old_top, new_top, 1)

          old_state = "libraryConversations=[],conversationSearch='',conversationFilter='all',librarySearch='';"
          new_state = "libraryConversations=[],conversationSearch='',conversationFilter='all',librarySearch='',realtimeChannel=null,realtimeBoxId=null,realtimeTimer=null,libraryPollTimer=null;"
          if old_state not in s:
              raise SystemExit('State target missing')
          s = s.replace(old_state, new_state, 1)

          helper_marker = 'async function rpc(name,args)'
          helpers = '''function setRealtimeState(state){var el=$('realtimeState');if(!el)return;var v=String(state||'').toUpperCase();if(v==='SUBSCRIBED'){el.className='liveState online';el.textContent='En direct'}else if(v==='CHANNEL_ERROR'||v==='TIMED_OUT'||v==='CLOSED'){el.className='liveState offline';el.textContent='Reconnexion…'}else{el.className='liveState';el.textContent='Connexion…'}}function stopOwnerRealtime(){if(realtimeTimer){clearTimeout(realtimeTimer);realtimeTimer=null}if(realtimeChannel){try{sb.removeChannel(realtimeChannel)}catch(e){}realtimeChannel=null}realtimeBoxId=null;setRealtimeState('CLOSED')}function scheduleRealtimeReload(){if(realtimeTimer)clearTimeout(realtimeTimer);realtimeTimer=setTimeout(function(){realtimeTimer=null;if(session&&box&&document.visibilityState!=='hidden')loadAll()},180)}function startOwnerRealtime(){if(!session||!box||!box.id||!sb||!sb.channel)return;if(realtimeChannel&&realtimeBoxId===box.id)return;stopOwnerRealtime();realtimeBoxId=box.id;setRealtimeState('CONNECTING');realtimeChannel=sb.channel('anonbox-owner-'+box.id).on('postgres_changes',{event:'*',schema:'public',table:'anonbox_messages_v2',filter:'box_id=eq.'+box.id},function(){scheduleRealtimeReload()}).subscribe(function(state){setRealtimeState(state)})}function startLibraryAutoRefresh(){if(libraryPollTimer)return;libraryPollTimer=setInterval(function(){if(mode==='library'&&document.visibilityState!=='hidden')loadLibrary(true)},6000)}function stopLibraryAutoRefresh(){if(libraryPollTimer){clearInterval(libraryPollTimer);libraryPollTimer=null}}'''
          if helper_marker not in s:
              raise SystemExit('Helper marker missing')
          s = s.replace(helper_marker, helpers + helper_marker, 1)

          old_init_library = "async function initLibrary(){var auth=await sb.auth.getSession();session=auth.data.session;var si=$('librarySearch');if(si){si.value=librarySearch;si.oninput=function(){librarySearch=si.value;renderLibraryList()}}await loadLibrary()}"
          new_init_library = "async function initLibrary(){var auth=await sb.auth.getSession();session=auth.data.session;var si=$('librarySearch');if(si){si.value=librarySearch;si.oninput=function(){librarySearch=si.value;renderLibraryList()}}await loadLibrary();startLibraryAutoRefresh()}"
          if old_init_library not in s:
              raise SystemExit('initLibrary target missing')
          s = s.replace(old_init_library, new_init_library, 1)

          old_load_library = 'async function loadLibrary(){if(!chatId){'
          new_load_library = 'async function loadLibrary(silent){if(!chatId&&!silent){'
          if old_load_library not in s:
              raise SystemExit('loadLibrary target missing')
          s = s.replace(old_load_library, new_load_library, 1)

          old_messages_assign = 'profile=p.data;box=b.data;messages=m.data||[];if(chatId){await renderOwnerChat()}else renderDashboard()'
          new_messages_assign = 'profile=p.data;box=b.data;messages=m.data||[];startOwnerRealtime();if(chatId){await renderOwnerChat()}else renderDashboard()'
          if old_messages_assign not in s:
              raise SystemExit('loadAll assignment target missing')
          s = s.replace(old_messages_assign, new_messages_assign, 1)

          old_logout = "$('logout').onclick=async function(){await sb.auth.signOut();goto(BASE+'?app=1')};"
          new_logout = "$('logout').onclick=async function(){stopOwnerRealtime();await sb.auth.signOut();goto(BASE+'?app=1')};"
          if old_logout not in s:
              raise SystemExit('logout target missing')
          s = s.replace(old_logout, new_logout, 1)

          old_sw = "if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});"
          new_sw = "document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){if(mode==='app'&&session&&box)loadAll();else if(mode==='library')loadLibrary(true)}});window.addEventListener('beforeunload',function(){stopLibraryAutoRefresh()});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});"
          if old_sw not in s:
              raise SystemExit('service worker target missing')
          s = s.replace(old_sw, new_sw, 1)

          p.write_text(s,encoding='utf-8')

          sw = Path('web/sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          if "const CACHE='anonbox-v4';" in sw_text:
              sw_text = sw_text.replace("const CACHE='anonbox-v4';", "const CACHE='anonbox-v5';", 1)
          elif "const CACHE='anonbox-v5';" not in sw_text:
              raise SystemExit('Unexpected service worker cache version')
          sw.write_text(sw_text,encoding='utf-8')
          PY
      - name: Validate frontend JavaScript
        id: validate
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python - <<'PY'
          from pathlib import Path
          import re
          s=Path('web/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/anonbox-inline.js').write_text(inline[-1],encoding='utf-8')
          PY
            node --check /tmp/anonbox-inline.js
            grep -q 'realtime-ui-v1' web/index.html
            grep -q "anonbox-v5" web/sw.js
          } 2>&1 | tee /tmp/validate.log
      - name: Commit realtime UI
        id: commit
        if: steps.patch.outcome == 'success' && steps.validate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "AnonBox CI"
          git config user.email "actions@users.noreply.github.com"
          git add web/index.html web/sw.js
          git commit -m "Enable live AnonBox message updates"
          git push
      - name: Report outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PATCH_LOG=$(tail -c 1800 /tmp/patch.log 2>/dev/null || true)
          VALIDATE_LOG=$(tail -c 1800 /tmp/validate.log 2>/dev/null || true)
          printf 'ANONBOX_REALTIME_REPORT patch=%s validation=%s commit=%s\n\nPATCH:\n%s\n\nVALIDATION:\n%s\n' "${{ steps.patch.outcome }}" "${{ steps.validate.outcome }}" "${{ steps.commit.outcome }}" "$PATCH_LOG" "$VALIDATE_LOG" > /tmp/report.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/report.txt
