name: Deploy AnonBox Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply messenger UI migration
        id: migration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            if ! grep -q 'messenger-ui-v4' web/index.html; then
              echo 'Expected messenger-ui-v4 marker is missing.'
              exit 1
            fi
          } 2>&1 | tee /tmp/anonbox-migration.log
      - name: Validate inline JavaScript
        id: validate
        if: steps.migration.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python - <<'PY'
          from pathlib import Path
          import re
          s=Path('web/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/anonbox-inline.js').write_text(inline[-1],encoding='utf-8')
          PY
            node --check /tmp/anonbox-inline.js
          } 2>&1 | tee /tmp/anonbox-validation.log
      - name: Fail on validation error
        if: steps.migration.outcome == 'failure' || steps.validate.outcome == 'failure'
        run: exit 1
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm issue-triggered deployment
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "ANONBOX_PAGES_DEPLOY_OK ${{ steps.deployment.outputs.page_url }}"
