name: Deploy AnonBox Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply compact chat contrast v8.1
        run: python .github/scripts/apply_chat_compact_contrast_v81.py

      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          inline = '\n'.join(s for s in scripts if s.strip())
          Path('/tmp/anonbox-inline.js').write_text(inline, encoding='utf-8')
          PY
          node --check /tmp/anonbox-inline.js

      - name: Save compact chat correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html web/sw.js web/version.txt
          if ! git diff --cached --quiet; then
            git commit -m "Compact chat controls and improve contrast"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful v8.1 deployment
        run: |
          printf 'chat-compact-contrast-v81-deployed\nsource=%s\nurl=%s\n' "$GITHUB_SHA" "${{ steps.deployment.outputs.page_url }}" > .github/v81-deploy-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/v81-deploy-ok.txt
          if ! git diff --cached --quiet; then
            git commit -m "Confirm compact chat contrast v8.1 deployment"
            git push
          fi
