name: Messenger UI v4

on:
  push:
    paths:
      - '.github/workflows/messenger-ui-v4.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade messenger navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('web/index.html')
          s = p.read_text(encoding='utf-8')
          if 'messenger-ui-v4' in s:
              raise SystemExit('messenger-ui-v4 already applied')

          # Fix HTML escaping typo left by a previous minification pass.
          s = s.replace("'\\\"':'&quot'", "'\\\"':'&quot;'", 1)

          css = r'''
    /* messenger-ui-v4 */
    .messengerTop{position:sticky;top:0;z-index:15;margin:-22px -16px 16px;padding:calc(12px + env(safe-area-inset-top)) 16px 11px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(7,10,18,.95);backdrop-filter:blur(18px);border-bottom:1px solid rgba(148,163,184,.14)}
    .topIdentity{display:flex;align-items:center;gap:11px;min-width:0}.topAvatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;overflow:hidden;flex:0 0 auto;background:linear-gradient(135deg,#312e81,#0e7490);border:1px solid rgba(148,163,184,.22);font-size:13px;font-weight:900}.topAvatar img{width:100%;height:100%;object-fit:cover}.pageTitle{font-size:20px;font-weight:900;letter-spacing:-.35px}.topUserLine{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}.topActions{display:flex;gap:7px}.iconButton{width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;background:#111827;border:1px solid var(--line);font-size:19px}
    .discussionTools{display:grid;gap:10px;margin:8px 0 14px}.searchBox{height:46px;display:flex;align-items:center;gap:9px;padding:0 13px;border-radius:23px;background:#101724;border:1px solid rgba(148,163,184,.16)}.searchBox:focus-within{border-color:rgba(139,92,246,.65);box-shadow:0 0 0 3px rgba(124,58,237,.09)}.searchBox span{color:#94a3b8;font-size:17px}.searchBox input{border:0;background:transparent;padding:0;box-shadow:none!important;height:42px;min-width:0}.searchBox input:focus{border:0;box-shadow:none}.filterChips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.filterChips::-webkit-scrollbar{display:none}.filterChip{flex:0 0 auto;padding:8px 12px;border-radius:999px;background:#101724;border:1px solid var(--line);color:#94a3b8;font-size:11px}.filterChip.active{background:rgba(124,58,237,.2);border-color:#7c3aed;color:#ede9fe}
    .messengerList{display:block;border:1px solid rgba(148,163,184,.14);border-radius:18px;overflow:hidden;background:rgba(9,14,24,.72)}.messengerList .conversationList{margin:0;border:0;border-radius:0;background:transparent}.messengerList .conversationList:not(:last-child){border-bottom:1px solid rgba(148,163,184,.11)}.messengerList .chatRow{padding:13px 12px}.messengerList .chatRow:hover{background:rgba(148,163,184,.045)}
    .libraryTools{display:grid;gap:8px;margin:8px 0 14px}.librarySummary{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:#64748b}
    .nav{grid-template-columns:repeat(4,1fr);gap:2px;bottom:8px;padding:5px;border-radius:22px;background:rgba(8,12,20,.97);box-shadow:0 15px 45px rgba(0,0,0,.38)}.nav button{min-width:0;position:relative;display:grid;place-items:center;gap:3px;padding:7px 3px 6px;border-radius:17px;font-size:10px;font-weight:750}.nav button.active{background:#18223a;color:white}.navIcon{font-size:18px;line-height:1}.navLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.navBadge{position:absolute;top:3px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;display:grid;place-items:center;background:#8b5cf6;color:white;font-size:9px;font-weight:900;border:2px solid #0b111d}
    .sectionTitle{margin-top:2px}.sectionTitle h2{font-size:25px}.appTop{display:none}.ownerDashboardBrandHidden{display:none!important}
          '''
          media_marker = '    @media(max-width:620px){'
          if media_marker not in s:
              raise SystemExit('CSS media marker not found')
          s = s.replace(media_marker, css + '\n' + media_marker, 1)
          s = s.replace('.bubble{max-width:88%}}', '.bubble{max-width:88%}.messengerTop{margin:-18px -13px 14px;padding-left:13px;padding-right:13px}.topUserLine{max-width:130px}.navLabel{font-size:9px}}', 1)

          old_library = '<div id="libraryStatus" class="status"></div><div id="libraryList" class="stack"></div>'
          new_library = '<div id="libraryStatus" class="status"></div><div class="libraryTools"><div class="searchBox"><span>⌕</span><input id="librarySearch" type="search" autocomplete="off" placeholder="Rechercher une conversation…"></div><div class="librarySummary"><span id="libraryResultSummary">Toutes les conversations</span><span id="libraryUnreadSummary"></span></div></div><div id="libraryList" class="messengerList"></div>'
          if old_library not in s:
              raise SystemExit('Library container target not found')
          s = s.replace(old_library, new_library, 1)

          old_top = '<div class="appTop"><div><div class="small muted">Connecté comme</div><div id="who" class="appTitle"></div></div><button id="refresh" class="secondary">Actualiser</button></div>'
          new_top = '<div class="messengerTop"><div class="topIdentity"><button id="topAvatar" class="topAvatar" aria-label="Ouvrir les paramètres">AB</button><div style="min-width:0"><div id="appPageTitle" class="pageTitle">Accueil</div><div class="small muted topUserLine">AnonBox · <span id="who"></span></div></div></div><div class="topActions"><button id="searchToggle" class="iconButton" aria-label="Rechercher">⌕</button><button id="refresh" class="iconButton" aria-label="Actualiser">↻</button></div></div>'
          if old_top not in s:
              raise SystemExit('App top target not found')
          s = s.replace(old_top, new_top, 1)

          old_messages = '<div id="messagesTab" class="tabPage hidden"><div class="sectionTitle"><div><h2>Discussions</h2><p class="muted">Tes conversations, classées par activité récente.</p></div></div><div id="allMessages" class="stack"></div></div>'
          new_messages = '<div id="messagesTab" class="tabPage hidden"><div class="sectionTitle"><div><h2>Discussions</h2><p class="muted">Tes conversations, classées par activité récente.</p></div></div><div class="discussionTools"><div class="searchBox"><span>⌕</span><input id="conversationSearch" type="search" autocomplete="off" placeholder="Rechercher une discussion…"></div><div class="filterChips"><button class="filterChip active" data-filter="all">Toutes</button><button class="filterChip" data-filter="unread">Non lues</button><button class="filterChip" data-filter="profiles">Profils</button><button class="filterChip" data-filter="anonymous">Anonymes</button></div></div><div id="allMessages" class="messengerList"></div></div>'
          if old_messages not in s:
              raise SystemExit('Messages tab target not found')
          s = s.replace(old_messages, new_messages, 1)

          old_nav = '<nav class="nav"><button data-tab="homeTab" class="active">✨ Nouveaux</button><button data-tab="messagesTab">💬 Messages</button><button data-tab="contactsTab">👥 Contacts</button><button data-tab="settingsTab">⚙️ Paramètres</button></nav>'
          new_nav = '<nav class="nav"><button data-tab="homeTab" class="active"><span class="navIcon">⌂</span><span class="navLabel">Accueil</span></button><button data-tab="messagesTab"><span class="navIcon">💬</span><span class="navLabel">Discussions</span><span id="messagesNavBadge" class="navBadge hidden">0</span></button><button data-tab="contactsTab"><span class="navIcon">👥</span><span class="navLabel">Profils</span></button><button data-tab="settingsTab"><span class="navIcon">⚙</span><span class="navLabel">Réglages</span></button></nav>'
          if old_nav not in s:
              raise SystemExit('Bottom nav target not found')
          s = s.replace(old_nav, new_nav, 1)

          s = s.replace("libraryConversations=[];", "libraryConversations=[],conversationSearch='',conversationFilter='all',librarySearch='';", 1)

          helper_marker = "async function rpc(name,args)"
          helpers = r'''function normaliseText(v){try{return String(v||'').toLocaleLowerCase('fr-FR').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}catch(e){return String(v||'').toLowerCase()}}function ownerConversationMatches(c){var info=conversationIdentity(c);if(conversationFilter==='unread'&&!info.unread)return false;if(conversationFilter==='profiles'&&!info.profile)return false;if(conversationFilter==='anonymous'&&info.profile)return false;var q=normaliseText(conversationSearch.trim());if(!q)return true;var text=info.name+' '+c.messages.map(function(m){return m.body||''}).join(' ');return normaliseText(text).indexOf(q)>=0}function libraryConversationMatches(c){var q=normaliseText(librarySearch.trim());if(!q)return true;var owner=c.owner||{},text=(owner.pseudonym||'')+' '+(c.title||'')+' '+(c.messages||[]).map(function(m){return m.body||''}).join(' ');return normaliseText(text).indexOf(q)>=0}function setPageTitle(tabId){var el=$('appPageTitle');if(!el)return;var labels={homeTab:'Accueil',messagesTab:'Discussions',contactsTab:'Profils',settingsTab:'Réglages'};el.textContent=labels[tabId]||'AnonBox'}function updateNavBadges(unread){var b=$('messagesNavBadge');if(!b)return;if(unread>0){b.textContent=unread>99?'99+':String(unread);b.classList.remove('hidden')}else b.classList.add('hidden')}function bindMessengerControls(){var search=$('conversationSearch');if(search){search.value=conversationSearch;search.oninput=function(){conversationSearch=search.value;renderDashboard()}}document.querySelectorAll('.filterChip').forEach(function(btn){btn.classList.toggle('active',btn.getAttribute('data-filter')===conversationFilter);btn.onclick=function(){conversationFilter=btn.getAttribute('data-filter')||'all';renderDashboard()}});var st=$('searchToggle');if(st)st.onclick=function(){activateTab('messagesTab');setTimeout(function(){var i=$('conversationSearch');if(i)i.focus()},30)};var av=$('topAvatar');if(av)av.onclick=function(){activateTab('settingsTab')}}'''
          if helper_marker not in s:
              raise SystemExit('JS helper marker not found')
          s = s.replace(helper_marker, helpers + helper_marker, 1)

          s = s.replace("async function initLibrary(){var auth=await sb.auth.getSession();session=auth.data.session;await loadLibrary()}", "async function initLibrary(){var auth=await sb.auth.getSession();session=auth.data.session;var si=$('librarySearch');if(si){si.value=librarySearch;si.oninput=function(){librarySearch=si.value;renderLibraryList()}}await loadLibrary()}", 1)

          pattern_library = re.compile(r"function renderLibraryList\(\)\{.*?\}function renderLibraryConversation", re.S)
          replacement_library = "function renderLibraryList(){var visible=libraryConversations.filter(libraryConversationMatches),unreadTotal=libraryConversations.reduce(function(n,c){return n+(c.messages||[]).filter(function(m){return m.direction==='owner'&&!m.read_at}).length},0);if($('libraryUnreadSummary'))$('libraryUnreadSummary').textContent=unreadTotal?(unreadTotal+' non lu'+(unreadTotal>1?'s':'')):'';if($('libraryResultSummary'))$('libraryResultSummary').textContent=librarySearch.trim()?(visible.length+' résultat'+(visible.length>1?'s':'')):'Toutes les conversations';if(!visible.length){$('libraryList').innerHTML='<div class=\"empty\">'+(librarySearch.trim()?'Aucune conversation ne correspond à ta recherche.':'Aucune conversation enregistrée sur ce navigateur pour le moment.')+'</div>';return}$('libraryList').innerHTML=visible.map(renderLibraryConversation).join('');document.querySelectorAll('.libraryConversationRow').forEach(function(row){row.onclick=function(){goto(BASE+'?library=1&chat='+encodeURIComponent(row.getAttribute('data-id')))}})}function renderLibraryConversation"
          s, n = pattern_library.subn(replacement_library, s, count=1)
          if n != 1:
              raise SystemExit('renderLibraryList replacement failed')

          pattern_dashboard = re.compile(r"function renderDashboard\(\)\{.*?\}function bindOwnerRows", re.S)
          replacement_dashboard = r'''function renderDashboard(){var visitorMessages=messages.filter(function(x){return x.direction==='visitor'}),convs=groupConversations(),unreadTotal=visitorMessages.filter(function(x){return !x.read_at}).length;$('who').textContent=profile.pseudonym;$('newCount').textContent=String(unreadTotal);$('totalCount').textContent=String(visitorMessages.length);var contactMap={};visitorMessages.filter(function(x){return x.sender_mode==='profile'&&x.sender_user_id}).forEach(function(x){contactMap[x.sender_user_id]=x});var contacts=Object.keys(contactMap).map(function(k){return contactMap[k]});$('profileCount').textContent=String(contacts.length);var link=BASE+'?to='+encodeURIComponent(box.slug);$('shareLink').value=link;var newConvs=convs.filter(function(c){return conversationIdentity(c).unread}),filteredConvs=convs.filter(ownerConversationMatches);$('newMessages').innerHTML=newConvs.length?newConvs.map(renderOwnerConversation).join(''):'<div class="card muted">Aucun nouveau message.</div>';$('allMessages').innerHTML=filteredConvs.length?filteredConvs.map(renderOwnerConversation).join(''):'<div class="empty">'+((conversationSearch.trim()||conversationFilter!=='all')?'Aucune discussion ne correspond à ce filtre.':'Aucune conversation.')+'</div>';$('contacts').innerHTML=contacts.length?contacts.map(function(c){var av=avatarUrl(c.sender_avatar_path_snapshot);return '<div class="contact">'+(av?'<img class="msgAvatar" src="'+esc(av)+'" alt="">':'<div class="msgAvatar">'+esc((c.sender_pseudonym_snapshot||'?').slice(0,2).toUpperCase())+'</div>')+'<div><b>'+esc(c.sender_pseudonym_snapshot||'Profil')+'</b><div class="small muted">A choisi volontairement « Mon profil »</div></div></div>'}).join(''):'<div class="card muted">Aucun expéditeur avec profil pour le moment.</div>';bindOwnerRows();updateNavBadges(unreadTotal);bindMessengerControls();var top=$('topAvatar');if(top){if(profile.avatar_path)top.innerHTML='<img src="'+esc(avatarUrl(profile.avatar_path))+'" alt="">';else top.textContent=(profile.pseudonym||'AB').slice(0,2).toUpperCase()}$('setName').value=profile.display_name||'';$('setPseudo').value=profile.pseudonym||'';$('setBio').value=profile.bio||'';$('setTitle').value=box.title||'';$('setWelcome').value=box.welcome_message||'';$('setSlug').value=box.slug;$('setAnon').checked=!!box.allow_anonymous;$('setProfile').checked=!!box.allow_profile_messages;$('setOpen').checked=!!box.is_open;if(profile.avatar_path){$('avatarPreview').src=avatarUrl(profile.avatar_path);show('avatarPreview')}var requested=qs.get('tab');if(requested==='messages')activateTab('messagesTab');else if(requested==='contacts')activateTab('contactsTab');else if(requested==='settings')activateTab('settingsTab');else{var active=document.querySelector('.nav button.active');setPageTitle(active?active.getAttribute('data-tab'):'homeTab')}}function bindOwnerRows'''
          s, n = pattern_dashboard.subn(replacement_dashboard, s, count=1)
          if n != 1:
              raise SystemExit('renderDashboard replacement failed')

          old_activate = "function activateTab(tabId){document.querySelectorAll('.tabPage').forEach(function(p){p.classList.add('hidden')});show(tabId);document.querySelectorAll('.nav button').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-tab')===tabId)})}"
          new_activate = "function activateTab(tabId){document.querySelectorAll('.tabPage').forEach(function(p){p.classList.add('hidden')});show(tabId);document.querySelectorAll('.nav button').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-tab')===tabId)});setPageTitle(tabId)}"
          if old_activate not in s:
              raise SystemExit('activateTab target not found')
          s = s.replace(old_activate, new_activate, 1)

          old_open = "async function openDashboard(){if(chatId){hideFullChat();show('appView');hide('authView');hide('dashboard');showFullChat();await loadAll();return}hide('authView');show('dashboard');await loadAll()}"
          new_open = "async function openDashboard(){var globalBrand=document.querySelector('#normalShell>.brand');if(globalBrand)globalBrand.classList.add('ownerDashboardBrandHidden');if(chatId){hideFullChat();show('appView');hide('authView');hide('dashboard');showFullChat();await loadAll();return}hide('authView');show('dashboard');await loadAll()}"
          if old_open not in s:
              raise SystemExit('openDashboard target not found')
          s = s.replace(old_open, new_open, 1)

          # Basic integrity checks.
          for token in ['conversationSearch','messagesNavBadge','librarySearch','messenger-ui-v4','filterChip','appPageTitle']:
              if token not in s:
                  raise SystemExit('Missing expected token: '+token)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('web/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/anonbox-inline.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/anonbox-inline.js
      - name: Commit UI improvements
        shell: bash
        run: |
          git config user.name "AnonBox CI"
          git config user.email "actions@users.noreply.github.com"
          git add web/index.html
          git commit -m "Polish messenger navigation search filters and unread badges"
          git push
