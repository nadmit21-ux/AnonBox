plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.nadmit.anonbox'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nadmit.anonbox'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.2.6'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-messaging'
}
